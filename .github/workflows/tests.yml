name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Swift and setup helpers
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          swift --version
          python3 --version
      - name: Test Swift input and connection logic
        run: zsh scripts/test.sh
      - name: Test setup helpers
        if: success() || failure()
        run: python3 -m unittest discover -s scripts/tests -v
