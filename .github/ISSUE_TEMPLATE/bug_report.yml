name: Bug report
description: Report a problem with building, connecting, or using Styleus.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please check SETUP.md first, especially the troubleshooting section.
        This report will be public. Do not include pairing codes or QR images, Apple Account details, signing files, device identifiers, or private documents. Remove personal paths and identifiers from any logs or screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. …
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Model names are enough; do not include serial numbers or device IDs.
      value: |
        Mac model / Intel or Apple silicon:
        macOS version:
        iPad model:
        iPadOS version:
        Apple Pencil model:
        Xcode version (for build or installation problems):
        Styleus commit or download date:
        Both apps built from the same source version: Yes / No / Unsure
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB-C / wired
        - Wi-Fi
        - Both
        - Not applicable (build or installation)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Mode and Mac app
      description: Trackpad or Drawing tablet? Which Mac app and version? Is experimental pinch zoom enabled? Mention mouse or scroll utilities if relevant.
  - type: textarea
    id: details
    attributes:
      label: Error details or additional context
      description: Include the exact error or a short, redacted log excerpt. Connection details are available from the iPad status ⓘ button. Review attachments before uploading.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed pairing secrets, account details, device identifiers, and private content from this report and its attachments.
          required: true
